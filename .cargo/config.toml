# Linker flags required by livekit's `webrtc-sys`, copied from the SDK's own
# .cargo/config.toml. Without them, linking libwebrtc.a fails or the binary
# aborts at startup.
#
# These apply to EVERY build, not just `--features native-rtc` — cargo has no
# way to make rustflags conditional on a feature. Spike D measures whether the
# baseline (no native-rtc) still builds and runs under them, because
# `crt-static` on Windows in particular changes CRT linkage process-wide.

# lld is needed to link libwebrtc.a on aarch64-linux.
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# `-ObjC` must also reach rustdoc: doctest binaries are linked by rustdoc and
# do not inherit `rustflags`. Without it the ObjC categories inside libwebrtc's
# static lib (e.g. `NSString (StdString)`) never load, and static initializers
# such as RTCH264ProfileLevelId.mm abort at process startup.
[target.x86_64-apple-darwin]
rustflags = ["-C", "link-args=-ObjC"]
rustdocflags = ["-C", "link-args=-ObjC"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-args=-ObjC"]
rustdocflags = ["-C", "link-args=-ObjC"]

[target.aarch64-apple-ios]
rustflags = ["-C", "link-args=-ObjC"]
rustdocflags = ["-C", "link-args=-ObjC"]

[target.aarch64-apple-ios-sim]
rustflags = ["-C", "link-args=-ObjC"]
rustdocflags = ["-C", "link-args=-ObjC"]
